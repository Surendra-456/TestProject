<nav class="pagination" aria-label="Pagination">
  <span class="range">{{ startItem }}–{{ endItem }} of {{ totalCount }}</span>
  <label class="page-size">
    <span>Rows</span>
    <select [value]="pageSize" [disabled]="isLoading" (change)="changePageSize($event)" aria-label="Rows per page">
      <option [value]="5">5</option>
      <option [value]="10">10</option>
      <option [value]="25">25</option>
      <option [value]="50">50</option>
    </select>
  </label>
  <span class="page-count">Page {{ totalCount === 0 ? 0 : pageNumber }} of {{ totalPages }}</span>
  <button type="button" (click)="previous()" [disabled]="isLoading || pageNumber <= 1">Previous</button>
  <button type="button" (click)="next()" [disabled]="isLoading || pageNumber >= totalPages">Next</button>
</nav>
